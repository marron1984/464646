<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乃木坂46 メディアスクレイパー</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="header">
      <h1>乃木坂46 メディアスクレイパー</h1>
      <p class="subtitle">推しの画像・動画を自動収集</p>
    </header>

    <!-- タブナビゲーション -->
    <nav class="tabs">
      <button class="tab active" data-tab="oshi">推し設定</button>
      <button class="tab" data-tab="scrape">収集実行</button>
      <button class="tab" data-tab="settings">詳細設定</button>
    </nav>

    <!-- 推し設定タブ -->
    <section id="tab-oshi" class="tab-content active">
      <div class="card">
        <h2>あなたの推しメンバー</h2>
        <p class="hint">ドラッグで順番変更 / 上ほど優先的に収集します</p>
        <div id="oshi-list" class="oshi-list"></div>
        <div id="no-oshi" class="empty-state">
          まだ推しが設定されていません。<br>下のメンバー一覧から追加してください。
        </div>
      </div>

      <div class="card">
        <h2>メンバー一覧</h2>
        <input type="text" id="member-search" placeholder="メンバー名で検索..." class="search-input">
        <div class="gen-filters">
          <button class="gen-btn active" data-gen="all">全員</button>
          <button class="gen-btn" data-gen="3">3期生</button>
          <button class="gen-btn" data-gen="4">4期生</button>
          <button class="gen-btn" data-gen="5">5期生</button>
        </div>
        <div id="member-grid" class="member-grid"></div>
      </div>

      <div class="card">
        <h2>推し収集設定</h2>
        <div class="form-group">
          <label>推しメンバーの最大ページ数</label>
          <input type="number" id="oshi-max-pages" value="20" min="1" max="100" class="input-number">
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="collect-non-oshi" checked>
            推し以外のメンバーも収集する
          </label>
        </div>
        <div class="form-group" id="non-oshi-pages-group">
          <label>推し以外の最大ページ数</label>
          <input type="number" id="non-oshi-max-pages" value="2" min="0" max="20" class="input-number">
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="oshi-youtube-search" checked>
            推しメンバーのYouTube動画も検索する
          </label>
        </div>
        <button id="save-oshi-settings" class="btn btn-primary">設定を保存</button>
      </div>
    </section>

    <!-- 収集実行タブ -->
    <section id="tab-scrape" class="tab-content">
      <div class="card">
        <h2>収集モード</h2>
        <div class="mode-buttons">
          <button class="mode-btn selected" data-mode="blog">
            <span class="mode-icon">&#128247;</span>
            <span class="mode-label">ブログ画像</span>
            <span class="mode-desc">公式ブログから画像収集</span>
          </button>
          <button class="mode-btn" data-mode="youtube">
            <span class="mode-icon">&#127909;</span>
            <span class="mode-label">YouTube動画</span>
            <span class="mode-desc">公式チャンネル・検索</span>
          </button>
          <button class="mode-btn" data-mode="all">
            <span class="mode-icon">&#11088;</span>
            <span class="mode-label">全部まとめて</span>
            <span class="mode-desc">ブログ + YouTube一括</span>
          </button>
        </div>
      </div>

      <div class="card" id="url-input-card" style="display:none">
        <h2>対象URL</h2>
        <textarea id="target-urls" class="url-textarea" placeholder="URLを1行に1つ入力..."></textarea>
      </div>

      <div class="card">
        <h2>収集対象</h2>
        <div id="scrape-targets" class="scrape-targets">
          <p class="hint">推しメンバーが優先的に収集されます</p>
        </div>
        <button id="start-scrape" class="btn btn-accent btn-large">
          &#9654; 収集開始
        </button>
      </div>

      <div class="card" id="progress-card" style="display:none">
        <h2>進捗状況</h2>
        <div id="progress-bar-container" class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-log" class="progress-log"></div>
        <div id="progress-result" class="progress-result"></div>
      </div>
    </section>

    <!-- 設定タブ -->
    <section id="tab-settings" class="tab-content">
      <div class="card">
        <h2>ダウンロード設定</h2>
        <div class="form-group">
          <label>保存先ディレクトリ</label>
          <input type="text" id="download-dir" value="./downloads" class="input-text">
        </div>
        <div class="form-group">
          <label>リクエスト間隔（秒）</label>
          <input type="number" id="request-delay" value="2.0" min="0.5" max="10" step="0.5" class="input-number">
          <span class="hint">サーバー負荷軽減のため2秒以上を推奨</span>
        </div>
        <div class="form-group">
          <label>YouTube動画品質</label>
          <select id="youtube-quality" class="input-select">
            <option value="360p">360p</option>
            <option value="480p">480p</option>
            <option value="720p" selected>720p</option>
            <option value="1080p">1080p</option>
            <option value="best">最高画質</option>
          </select>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="skip-existing" checked>
            既存ファイルをスキップ
          </label>
        </div>
        <button id="save-config" class="btn btn-primary">設定を保存</button>
      </div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
